# Arix — self-hosted AI sales agent for WooCommerce over WhatsApp.
# Postgres + server + dashboard. First run: open http://localhost:3000 locally
# for the setup wizard; do not publish it before the first admin is created.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  server:
    build:
      # Repo root, not ./server: the Dockerfile needs the root
      # pnpm-lock.yaml/pnpm-workspace.yaml for a workspace-aware install.
      context: .
      dockerfile: server/Dockerfile
    image: arix-server
    env_file: .env
    environment:
      # Override host-specific values for the Docker network.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      RECEIPTS_DIR: /app/data/receipts
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - receipts:/app/data/receipts
    # Not published to the host: the dashboard reaches it internally as server:3001,
    # and the WhatsApp QR is scanned from the dashboard's setup wizard (no host port
    # needed for that). Health is checked inside the container below.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  dashboard:
    build:
      # Repo root, not ./dashboard: the Dockerfile needs the root
      # pnpm-lock.yaml/pnpm-workspace.yaml for a workspace-aware, frozen-
      # lockfile install (mirrors the server service above).
      context: .
      dockerfile: dashboard/Dockerfile
    image: arix-dashboard
    environment:
      # Explicit allowlist: never inject the server's DATABASE_URL,
      # SETUP_TOKEN, encryption keys, LLM/WooCommerce credentials, etc. into
      # this internet-facing container.
      SERVER_API_URL: http://server:3001
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      # Loopback only. Put an authenticated/TLS reverse proxy in front only
      # after completing the one-shot bootstrap locally (see deploy guide).
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  pgdata:
  receipts:
